# ===============================
# PERFIL POR DEFECTO
# ===============================
# Garantiza que, sin importar cómo se arranque el backend (IDE, mvn, java -jar),
# siempre se cargue el perfil 'dev' y por lo tanto SIEMPRE se conecte a la
# MISMA base de datos. Antes esto no estaba definido: si el perfil no se
# activaba a mano, Spring usaba una BD distinta (gav vs gav1) y daba la
# falsa impresión de que la BD se "reseteaba" entre arranques.
spring.profiles.active=dev

# ===============================
# MYSQL DATABASE  (BD CANÓNICA = gav1)
# ===============================
# Misma URL/BD que application-dev.properties para evitar divergencia entre
# perfiles. Si en el futuro se agrega un perfil 'prod', poner allí otra URL.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gav1?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# PERSISTENCIA: 'update' añade columnas/tablas faltantes pero NO borra datos.
# NUNCA usar 'create', 'create-drop' ni 'drop-and-create' (recrean el esquema).
# En producción usar 'validate' (solo verifica que el esquema coincide con las
# entidades; no toca nada).
spring.jpa.hibernate.ddl-auto=update
# Para ver el SQL: show-sql=true y org.hibernate.SQL=DEBUG
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT
# ===============================
# Secreto en Base64 válido (≥256 bits para HS256)
jwt.secret=Z2F2U2VjcmV0S2V5UGFyYUpXVDIwMjVHZXN0aW9uQXNpZ25hY2lvbkRlVmlhamVzQ2FydGFnZW5h
jwt.expiration=86400000

# ===============================
# CHATBOT (Gemini) — URL pública; la API key va en secrets.properties (gitignored)
# ===============================
# gemini-1.5-flash fue retirado por Google (404). gemini-2.5-flash es el modelo
# estable vigente que soporta generateContent en la API v1beta.
chatbot.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
chatbot.timeout-ms=15000
chatbot.max-lugares-grounding=25
chatbot.top-solicitados=10

# ===============================
# SECRETS (chatbot key, etc.) — archivos gitignoreados
# ===============================
spring.config.import=optional:classpath:secrets.properties,optional:file:./secrets.properties

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO

# ===============================
# SERVER
# ===============================
server.port=8080
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5000