# =========================================
# PERFIL DE PRODUCCIÓN (Docker / Azure)
# Se activa con SPRING_PROFILES_ACTIVE=prod (lo pone deploy/docker-compose.yml).
# Ningún secreto vive aquí: todo llega por variables de entorno desde deploy/.env
# =========================================

# MYSQL (Azure Database for MySQL Flexible Server, TLS obligatorio)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA: el proyecto no usa migraciones Flyway; Hibernate crea/actualiza el esquema
# igual que en dev ('update' nunca borra datos).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=false

# JWT (secreto Base64 de 256 bits o más, distinto al de desarrollo)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CHATBOT (Gemini)
chatbot.provider=gemini
chatbot.api-key=${CHATBOT_API_KEY:}

# Usuario admin inicial (AdminSeeder): cambiar la clave por defecto
admin.seed.password=${ADMIN_SEED_PASSWORD:admin123}

# CORS: dominio público de la web (Flutter Web servido por Caddy)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Detrás de Caddy (HTTPS): respetar X-Forwarded-*
server.forward-headers-strategy=framework
server.port=8080

# LOGGING
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO
