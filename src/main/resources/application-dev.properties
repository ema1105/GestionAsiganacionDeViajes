spring.application.name=gav

# =========================================
# ENTORNO DE DESARROLLO
# =========================================

# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gav1?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / HIBERNATE
# =========================================

# PERSISTENCIA: 'update' no borra datos entre arranques. Solo añade
# columnas/tablas faltantes. NUNCA usar 'create' ni 'create-drop' en dev
# si se quiere conservar los datos. Para producción usar 'validate'.
spring.jpa.hibernate.ddl-auto=update

# Para ver el SQL: show-sql=true y org.hibernate.SQL=DEBUG
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================
# FLYWAY
# =========================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# =========================================
# LOGGING
# =========================================
logging.level.org.springframework.jdbc=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO

# =========================================
# JWT
# =========================================
jwt.secret=dGhpc0lzQVNlY3JldEtleUZvckpXVFNpZ25pbmdQdXJwb3Nlc09ubHkxMjM0NTY=
jwt.expiration=86400000

# =========================================
# CHATBOT
# =========================================
chatbot.provider=gemini
chatbot.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
chatbot.api-key=${CHATBOT_API_KEY:}
chatbot.timeout-ms=15000
chatbot.max-lugares-grounding=25
chatbot.top-solicitados=10