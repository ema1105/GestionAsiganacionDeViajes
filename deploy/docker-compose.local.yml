# GAV — prueba local con Docker Desktop (y Plan C de la presentación).
# Igual al de la nube pero con MySQL en contenedor, sin Caddy y con puertos abiertos.
#
#   cd deploy
#   docker compose -f docker-compose.local.yml up -d --build
#   http://localhost:8080/swagger-ui.html          -> API Spring Boot
#   http://localhost:8000/api/prediccion/salud     -> prediction-service
#   http://localhost:8000/docs                     -> Swagger de FastAPI
#   MySQL Workbench -> 127.0.0.1:3308 (gav_admin / gavlocal123)   [no choca con tu MySQL local (3306) ni con el túnel a Azure (3307)]
#
#   docker compose -f docker-compose.local.yml down       (apagar)
#   docker compose -f docker-compose.local.yml down -v    (apagar y BORRAR la base del contenedor)
#
# ¿Probar con TU base real (gav1 en el MySQL de Windows)? Cambia en backend:
#   SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/gav1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   y usuario/clave de tu MySQL local.

name: gav-local

services:
  mysql:
    image: mysql:8.0
    container_name: gav-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gav
      MYSQL_USER: gav_admin
      MYSQL_PASSWORD: gavlocal123
      TZ: America/Bogota
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
    image: gav-backend:local
    container_name: gav-local-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/gav?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: gav_admin
      SPRING_DATASOURCE_PASSWORD: gavlocal123
      JWT_SECRET: ${JWT_SECRET:-Z2F2LWxvY2FsLXNvbG8tcGFyYS1wcnVlYmFzLWVuLWRvY2tlci1kZXNrdG9wLTI1Ng==}
      CHATBOT_API_KEY: ${CHATBOT_API_KEY:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-admin123}
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:5000,http://localhost:5173"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
      TZ: America/Bogota
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  prediction:
    build:
      context: ../prediction-service
    image: gav-prediction:local
    container_name: gav-local-prediction
    restart: unless-stopped
    environment:
      GAV_DB_URL: "mysql+pymysql://gav_admin:gavlocal123@mysql:3306/gav"
      GAV_API_KEY: ""
      TZ: America/Bogota
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
